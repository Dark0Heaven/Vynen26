name: https-check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for h in vynen26.de www.vynen26.de; do
            echo "== $h"; dig +short A $h; dig +short CNAME $h
            echo | openssl s_client -connect $h:443 -servername $h 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName || echo "kein Zertifikat"
            curl -sI http://$h | head -3
          done
